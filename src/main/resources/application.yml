spring:
  config:
    activate:
      on-profile: local
    import:
      - optional:file:local.env[.properties]
      - optional:file:prod.env[.properties]

  profiles:
    active: local

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        show_sql: true
        format_sql: true
        default_batch_fetch_size: 100
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  data:
    redis:
      host: redis-14791.c340.ap-northeast-2-1.ec2.redns.redis-cloud.com
      port: 14791
      username: default
      password: ${REDIS_PASSWORD}
      timeout: 3000ms

  security:
    oauth2:
      client:
        registration:
          keycloak:
            client-id: ${KEYCLOAK_CLIENT_ID}
            client-secret: ${KEYCLOAK_CLIENT_SECRET}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - openid
              - profile
              - email
        provider:
          keycloak:
            issuer-uri: https://keycloak6.sparta-project.xyz/realms/delivery
      resourceserver:
        jwt:
          issuer-uri: https://keycloak6.sparta-project.xyz/realms/delivery

# OPEN DOC API 설정
springdoc:
  version: '1.0.0'
  api-docs:
    path: /api-docs
  default-consumes-media-type: application/json
  default-produces-media-type: application/json
  swagger-ui:
    operations-sorter: alpha
    tags-sorter: alpha
    path: /api-docs.html
    disable-swagger-default-url: true
    doc-expansion: full
  paths-to-match:
    - /v1/**
  cache:
    disabled: true

keycloak:
  server-url: ${KEYCLOAK_SERVER_URL}
  realm: ${KEYCLOAK_REALM}
  client-id: ${KEYCLOAK_CLIENT_ID}
  client-secret: ${KEYCLOAK_CLIENT_SECRET}
  admin-username: ${KEYCLOAK_ADMIN_USERNAME}
  admin-password: ${KEYCLOAK_ADMIN_PASSWORD}

toss:
  secret-key: ${TOSS_SECRET_KEY}

logging:
  level:
    root: info
    com.example.orderjobabom: debug
    org.springframework.web: debug
    org.hibernate.SQL: debug
    org.springframework.security: debug

